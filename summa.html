<!DOCTYPE html>
<html>
    <head>
        <title>MacBook Pro</title>
        <style>
            button {
                align-items: center;
                transition: all 0.3s;
            }

            button:hover {
                transform: scale(1.05);
            }

            p {
                text-align: center;
                font-family: Arial;
                margin-top: 0px;
                margin-bottom: 10px;
            }

            .smol {
                font-size: 12px;
                color: rgb(211, 136, 38);
                font-weight: bold;
            }

            .title {
                font-size: 24px;
                color: black;
                font-weight: bold;
            }

            .description {
                font-size: 32px;
                color: rgb(15, 14, 14);
                font-weight: bold;
            }

            .price {
                font-size: 18px;
                color: rgb(74, 76, 74);
            }

            .option {
                display: block;
                margin: 0 auto;
                height: 40px;
                text-align: center;
                align-items: center;
                font-size: 20px;
                color: white;
                background-color: rgb(10, 102, 194);
                border: none;
                padding-bottom: 5px;
                padding-top: 5px;
                border-radius: 20px;
                width: 80px;
                cursor: pointer;
            }
        </style>
    </head>
    <body>
        <p class="smol">
            New
        </p>
        <p class="title">
            MacBook Pro
        </p>
        <p class="description">
            Supercharged for pros.
        </p>
        <p class="price">
            From $1999
        </p>
        <button class="option">
            Buy
        </button>
    </body>
</html>
